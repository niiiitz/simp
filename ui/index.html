<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" sizes="1024x1024" href="/simp-icon-dark.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/simp-icon-dark.png" />
    <title>SIMP — Simple Integrated Media Player</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000000;
        color: #d4d4dc;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      button:focus,
      button:focus-visible,
      input:focus,
      select:focus,
      [data-focusable="true"]:focus {
        outline: 2px solid #2aa3c4 !important;
        outline-offset: 2px !important;
        box-shadow: 0 0 0 3px rgba(42, 163, 196, 0.35) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
