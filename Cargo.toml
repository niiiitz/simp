[workspace]
resolver = "2"
members = [
    "crates/simp-protocol",
    "crates/simp-core",
    "crates/simp-daemon",
    "src-tauri",
]

[workspace.package]
version = "0.3.0-alpha.6"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["niiiitz"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "signal"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
keyvalues-parser = "0.2"
keyvalues-serde = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
lofty = "0.21"
blake3 = "1.5"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
symphonia = { version = "0.5.4", default-features = false, features = ["all"] }
souvlaki = "0.7"
moka = { version = "0.12", features = ["future"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
futures-util = "0.3"
mimalloc = { version = "0.1", default-features = false }
base64 = "0.22"
libc = "0.2"
sha1 = "0.10"
dbus = "0.9"
dbus-crossroads = "0.5"
objc = "0.2.7"
cocoa = "0.24.1"
core-foundation = "0.9.4"
core-graphics = "0.22.3"
block = "0.1.6"
dispatch = "0.2.0"

# Micro-Footprint Release Profile for SteamOS / gamescope
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Optimize heavy audio decoders even in debug builds to prevent audio stutter
[profile.dev.package."*"]
opt-level = 3

